name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # 确保工作流有权限创建 Release 并上传附件

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List files
        run: ls -la

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Create version info
        run: |
          echo "Build Date: $(date)" > dist/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> dist/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> dist/BUILD_INFO.txt

      - name: Create ZIP package
        run: |
          cd dist
          zip -r ../dandelions-itab-extension.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-build
          path: dandelions-itab-extension.zip # 严格只上传单个 zip 文件
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dandelions-itab-extension.zip
          name: Release ${{ github.ref_name }}  # 自动将 Tag 名字（如 v1.5.0）应用到 Release 标题
          tag_name: ${{ github.ref }}          # 明确绑定当前推送的 Tag
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}