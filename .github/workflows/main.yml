name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # 确保工作流有权限将打包好的 ZIP 写入到 Release 附件中

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到最新的 v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List files
        run: ls -la

      - name: Install dependencies
        run: npm install

      - name: Build extension        
        run: npm run build

      - name: Create version info
        run: |
          echo "Build Date: $(date)" > dist/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> dist/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> dist/BUILD_INFO.txt

      - name: Create ZIP package
        run: |
          cd dist
          # 核心修复：确保这里生成的压缩包名字和后面引用的一模一样
          zip -r ../dandelions-itab-extension.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-build
          path: dandelions-itab-extension.zip # 保持文件名统一
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2 # 升级到更稳定的 v2 版本
        with:
          files: dandelions-itab-extension.zip # 保持文件名统一
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
