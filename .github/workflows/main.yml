name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # 显式声明允许此工作流写入/修改 Release 附件

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List files
        run: ls -la

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-extension-version.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm install

      - name: Build extension        
        run: npm run build

      - name: Create version info
        run: |
          echo "Build Date: $(date)" > dist/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> dist/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> dist/BUILD_INFO.txt

      - name: Create ZIP package
        run: |
          cd dist
          # 核心修复：保持文件名与 release1.0_patch 绝对一致，防止混乱
          zip -r ../dandelions-itab-extension.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-build
          path: dandelions-itab-extension.zip # 修复：只传这一个具体的 zip 文件，去掉 dist/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2 # 升级至最新稳定版 v2
        with:
          files: dandelions-itab-extension.zip # 修复：精确匹配上面生成的压缩包
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
